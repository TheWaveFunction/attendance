<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Attendance Portal</title>

  <!-- PDF Generator Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --present: #16a34a;
      --absent: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Lock Screen */
    #lockScreen {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }

    .lock-box {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 16px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .pin-input {
      letter-spacing: 8px;
      font-size: 1.4rem;
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      width: 100%;
      margin: 12px 0;
    }

    .pin-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    header h1 {
      font-size: 1.3rem;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 0.72rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: #fff;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #e2e8f0;
      color: #475569;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .notice-bar {
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: none;
    }

    .notice-bar.existing {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      display: block;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { background: #f1f5f9; color: #334155; flex: 1; }
    .btn-save { background: #16a34a; color: white; width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 10px; }
    .btn-pdf { background: #0284c7; color: white; width: 100%; margin-top: 8px; }
    .btn-danger { background: #dc2626; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-edit { background: #d97706; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; margin-right: 4px; }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: #ffffff;
      margin-bottom: 8px;
      user-select: none;
    }

    .student-item.is-present {
      border-color: #86efac;
      background: #f0fdf4;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .status-badge.present { background: #22c55e; color: #ffffff; }
    .status-badge.absent { background: #e2e8f0; color: #64748b; }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .report-table th, .report-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }

    .report-table th {
      background: #f1f5f9;
      color: #334155;
    }

    .history-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <!-- Security Screen -->
  <div id="lockScreen">
    <div class="lock-box">
      <h2>🔒 Faculty Authorization</h2>
      <p style="font-size:0.82rem; color:#64748b;">Enter PIN (Default: 1234)</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="4" placeholder="••••" />
      <button class="btn btn-primary" style="width:100%;" onclick="verifyPin()">Unlock Register</button>
      <p id="pinError" style="color:var(--absent); font-size:0.8rem; margin-top:8px; display:none;">Incorrect PIN!</p>
    </div>
  </div>

  <div class="container" id="mainPortal" style="display: none;">
    <header>
      <div>
        <h1>Attendance Portal</h1>
        <p style="font-size:0.8rem; color:#16a34a;">● Live Firebase Connected</p>
      </div>
      <button class="btn" style="background:#fee2e2; color:var(--absent);" onclick="lockPortal()">🔒 Lock</button>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tabMarkBtn" onclick="switchTab('mark')">📝 Daily Register</button>
      <button class="tab-btn" id="tabReportBtn" onclick="switchTab('report')">📊 Final Report</button>
      <button class="tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">🗄️ History & Edit</button>
    </div>

    <!-- VIEW 1: DAILY ATTENDANCE -->
    <div id="viewMarkSection">
      <div class="card">
        <div class="grid-2">
          <div>
            <label>Subject</label>
            <input type="text" id="subject" value="Physics" onchange="loadDateAttendanceIfExists()" />
          </div>
          <div>
            <label>Semester (1 to 8)</label>
            <select id="semester" onchange="loadDateAttendanceIfExists()">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4" selected>Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6">Semester 6</option>
              <option value="Semester 7">Semester 7</option>
              <option value="Semester 8">Semester 8</option>
            </select>
          </div>
        </div>
        <div class="grid-2" style="margin-top: 10px;">
          <div>
            <label>Date</label>
            <input type="date" id="date" onchange="loadDateAttendanceIfExists()" />
          </div>
          <div>
            <label>Faculty</label>
            <input type="text" id="faculty" placeholder="Faculty Name" />
          </div>
        </div>
      </div>

      <div class="card">
        <!-- Live status indicator if old record is loaded -->
        <div id="statusNotice" class="notice-bar"></div>

        <div class="stats">
          <span>Total: <span id="totalCount">0</span></span>
          <span style="color:var(--present);">Present: <span id="presentCount">0</span></span>
          <span style="color:var(--absent);">Absent: <span id="absentCount">0</span></span>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline" onclick="resetAllAbsent()">🔄 Reset Today</button>
          <button class="btn btn-outline" onclick="markAllPresent()">✅ All Present</button>
        </div>

        <button id="saveBtn" class="btn btn-save" onclick="saveToCloud()">💾 Store Attendance in Cloud</button>
        <button class="btn btn-pdf" onclick="generateDailyPDF()">📥 Download 1-Page PDF</button>
      </div>

      <div id="studentListContainer"></div>
    </div>

    <!-- VIEW 2: FINAL REPORT -->
    <div id="viewReportSection" style="display: none;">
      <div class="card">
        <div class="grid-2" style="margin-bottom: 10px;">
          <div>
            <label>Subject</label>
            <input type="text" id="reportSub" value="Physics" />
          </div>
          <div>
            <label>Semester</label>
            <select id="reportSem">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4" selected>Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6">Semester 6</option>
              <option value="Semester 7">Semester 7</option>
              <option value="Semester 8">Semester 8</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" style="width: 100%;" onclick="loadCumulativeReport()">⚡ Calculate Report</button>
      </div>

      <div class="card" id="reportCard" style="display: none;">
        <div class="stats">
          <span>Total Classes: <span id="reportClassesHeld">0</span></span>
          <span id="reportMeta"></span>
        </div>
        <div id="reportTableArea"></div>
      </div>
    </div>

    <!-- VIEW 3: HISTORY & EDIT -->
    <div id="viewHistorySection" style="display: none;">
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <div>
            <h3 style="font-size:1rem;">Stored Cloud Records</h3>
            <p style="font-size:0.75rem; color:#64748b;">Directly edit any individual student's status.</p>
          </div>
          <button class="btn-danger" onclick="wipeEntireSemester()">⚠️ Wipe Semester</button>
        </div>

        <div style="margin-bottom: 12px;">
          <label>Filter by Semester</label>
          <select id="historySemFilter" onchange="loadSavedSessions()">
            <option value="Semester 1">Semester 1</option>
            <option value="Semester 2">Semester 2</option>
            <option value="Semester 3">Semester 3</option>
            <option value="Semester 4" selected>Semester 4</option>
            <option value="Semester 5">Semester 5</option>
            <option value="Semester 6">Semester 6</option>
            <option value="Semester 7">Semester 7</option>
            <option value="Semester 8">Semester 8</option>
          </select>
        </div>

        <div id="savedSessionsList">
          <div style="text-align:center; color:#64748b; padding:15px;">Loading saved data...</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyB5_ryiAbPhlPBbIOxIpLaW4srd4WwIOV4",
      authDomain: "college-attendance-4d566.firebaseapp.com",
      projectId: "college-attendance-4d566",
      storageBucket: "college-attendance-4d566.firebasestorage.app",
      messagingSenderId: "838810968081",
      appId: "1:838810968081:web:1600b06bf0e2075ef851b0",
      measurementId: "G-RD43P60JPE"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const INITIAL_STUDENTS = [
      { roll: "08", name: "Aladi Hansda" },
      { roll: "11", name: "Anuj Basa" },
      { roll: "15", name: "Sanjukta Bhakat" },
      { roll: "16", name: "Jayanti Hembram" },
      { roll: "17", name: "Puja Dutta" },
      { roll: "19", name: "Sagen Mandi" },
      { roll: "25", name: "Madhumita Giri" },
      { roll: "31", name: "Purva Rani Mahato" },
      { roll: "41", name: "Subash Murmu" },
      { roll: "42", name: "Dipali Murmu" },
      { roll: "50", name: "Meenakshi Pradhan" },
      { roll: "51", name: "Lilima Ahir" },
      { roll: "53", name: "Shankar Ravi Das" },
      { roll: "57", name: "Dipti Mahato" },
      { roll: "59", name: "Vijay Murmu" },
      { roll: "62", name: "Rawan Hembram" },
      { roll: "65", name: "Suresh Sardar" },
      { roll: "71", name: "Ronit Samant" },
      { roll: "73", name: "Gobinda Das Jana" }
    ];

    let students = [];
    let dailyAttendance = {};

    function verifyPin() {
      const pin = document.getElementById("pinInput").value;
      if (pin === "1234") {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("mainPortal").style.display = "block";
        document.getElementById("date").valueAsDate = new Date();
        loadDateAttendanceIfExists();
      } else {
        document.getElementById("pinError").style.display = "block";
      }
    }

    function lockPortal() {
      document.getElementById("lockScreen").style.display = "flex";
      document.getElementById("mainPortal").style.display = "none";
    }

    function switchTab(t) {
      document.getElementById("viewMarkSection").style.display = t === 'mark' ? 'block' : 'none';
      document.getElementById("viewReportSection").style.display = t === 'report' ? 'block' : 'none';
      document.getElementById("viewHistorySection").style.display = t === 'history' ? 'block' : 'none';

      document.getElementById("tabMarkBtn").className = `tab-btn ${t === 'mark' ? 'active' : ''}`;
      document.getElementById("tabReportBtn").className = `tab-btn ${t === 'report' ? 'active' : ''}`;
      document.getElementById("tabHistoryBtn").className = `tab-btn ${t === 'history' ? 'active' : ''}`;

      if (t === 'history') loadSavedSessions();
      if (t === 'report') loadCumulativeReport();
    }

    async function initDb() {
      const snap = await db.collection("students").get();
      if (snap.empty) {
        const batch = db.batch();
        INITIAL_STUDENTS.forEach(s => batch.set(db.collection("students").doc(s.roll), s));
        await batch.commit();
      }
    }
    initDb();

    db.collection("students").onSnapshot(snap => {
      students = [];
      snap.forEach(doc => {
        const d = doc.data();
        students.push({ id: doc.id, roll: d.roll, name: d.name });
        if (dailyAttendance[d.roll] === undefined) dailyAttendance[d.roll] = false;
      });
      renderList();
    });

    function renderList() {
      const cont = document.getElementById("studentListContainer");
      cont.innerHTML = "";
      students.sort((a, b) => parseInt(a.roll) - parseInt(b.roll));

      students.forEach(s => {
        const isPresent = !!dailyAttendance[s.roll];
        const div = document.createElement("div");
        div.className = `student-item ${isPresent ? 'is-present' : ''}`;
        div.innerHTML = `
          <div onclick="toggleAtt('${s.roll}')" style="cursor:pointer; flex:1;">
            <strong>#${s.roll}</strong> ${s.name}
          </div>
          <span class="status-badge ${isPresent ? 'present' : 'absent'}" onclick="toggleAtt('${s.roll}')">
            ${isPresent ? '✓ PRESENT' : 'ABSENT'}
          </span>
        `;
        cont.appendChild(div);
      });
      updateStats();
    }

    function toggleAtt(r) { dailyAttendance[r] = !dailyAttendance[r]; renderList(); }
    function resetAllAbsent() { students.forEach(s => dailyAttendance[s.roll] = false); renderList(); }
    function markAllPresent() { students.forEach(s => dailyAttendance[s.roll] = true); renderList(); }

    function updateStats() {
      const total = students.length;
      const present = Object.values(dailyAttendance).filter(Boolean).length;
      document.getElementById("totalCount").innerText = total;
      document.getElementById("presentCount").innerText = present;
      document.getElementById("absentCount").innerText = total - present;
    }

    // CHECK & LOAD SAVED ATTENDANCE IF ALREADY STORED FOR SELECTED DATE
    async function loadDateAttendanceIfExists() {
      const sub = document.getElementById("subject").value.trim() || "Physics";
      const sem = document.getElementById("semester").value;
      const dt = document.getElementById("date").value;
      const notice = document.getElementById("statusNotice");
      const saveBtn = document.getElementById("saveBtn");

      if (!dt) return;

      const docId = `${dt}_${sem.replace(/\s+/g, '_')}_${sub.replace(/\s+/g, '_')}`;

      try {
        const doc = await db.collection("attendance_history").doc(docId).get();
        if (doc.exists) {
          const data = doc.data();
          if (data.records && Array.isArray(data.records)) {
            data.records.forEach(r => {
              dailyAttendance[r.roll] = (r.status === "PRESENT");
            });
          }
          renderList();
          notice.className = "notice-bar existing";
          notice.innerHTML = `⚠️ <b>Saved Cloud Record Loaded:</b> Aap <b>${dt}</b> ki attendance dekh rahe hain. Kisi bhi bache ka status badalkar "Update" dabayein.`;
          saveBtn.innerText = "🔄 Update / Overwrite Attendance";
          saveBtn.style.background = "#d97706";
        } else {
          notice.className = "notice-bar";
          notice.style.display = "none";
          saveBtn.innerText = "💾 Store Attendance in Cloud";
          saveBtn.style.background = "#16a34a";
        }
      } catch (e) {
        console.error("Check Error: ", e);
      }
    }

    // SAVE / UPDATE TO FIRESTORE
    async function saveToCloud() {
      const sub = document.getElementById("subject").value.trim() || "Physics";
      const sem = document.getElementById("semester").value;
      const dt = document.getElementById("date").value || new Date().toISOString().slice(0, 10);
      const fac = document.getElementById("faculty").value.trim() || "Faculty";

      const records = students.map(s => ({
        roll: s.roll,
        name: s.name,
        status: dailyAttendance[s.roll] ? "PRESENT" : "ABSENT"
      }));

      const docId = `${dt}_${sem.replace(/\s+/g, '_')}_${sub.replace(/\s+/g, '_')}`;

      try {
        await db.collection("attendance_history").doc(docId).set({
          date: dt,
          subject: sub,
          semester: sem,
          faculty: fac,
          total: students.length,
          present: Object.values(dailyAttendance).filter(Boolean).length,
          records: records,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert(`✅ Attendance updated successfully in Cloud!\nDate: ${dt}\nSubject: ${sub}`);
        loadDateAttendanceIfExists();
      } catch (e) {
        alert("Save Error: " + e.message);
      }
    }

    // LOAD HISTORY SESSIONS
    async function loadSavedSessions() {
      const sem = document.getElementById("historySemFilter").value;
      const cont = document.getElementById("savedSessionsList");
      cont.innerHTML = `<div style="text-align:center; padding:15px; color:#64748b;">Loading...</div>`;

      try {
        const snap = await db.collection("attendance_history").where("semester", "==", sem).get();
        if (snap.empty) {
          cont.innerHTML = `<div style="text-align:center; padding:15px; color:#64748b;">No records found for ${sem}.</div>`;
          return;
        }

        let html = "";
        snap.forEach(doc => {
          const d = doc.data();
          html += `
            <div class="history-card">
              <div>
                <strong>📅 ${d.date}</strong> — <span>${d.subject}</span>
                <div style="font-size:0.75rem; color:#64748b;">Present: ${d.present}/${d.total}</div>
              </div>
              <div>
                <button class="btn-edit" onclick="editSessionDirect('${d.date}', '${d.semester}', '${d.subject}')">
                  ✏️ Edit
                </button>
                <button class="btn-danger" onclick="deleteCloudRecord('${doc.id}', '${d.date}')">
                  🗑️ Delete
                </button>
              </div>
            </div>
          `;
        });
        cont.innerHTML = html;
      } catch (e) {
        cont.innerHTML = `<div style="color:red;">Error: ${e.message}</div>`;
      }
    }

    // EDIT SESSION: Switches to register and loads the exact class
    function editSessionDirect(date, sem, sub) {
      document.getElementById("semester").value = sem;
      document.getElementById("subject").value = sub;
      document.getElementById("date").value = date;
      switchTab('mark');
      loadDateAttendanceIfExists();
    }

    async function deleteCloudRecord(docId, date) {
      if (confirm(`Kya aap ${date} ka record cloud database se permanently delete karna chahte hain?`)) {
        try {
          await db.collection("attendance_history").doc(docId).delete();
          alert("✅ Deleted successfully!");
          loadSavedSessions();
        } catch (e) {
          alert("Delete failed: " + e.message);
        }
      }
    }

    async function wipeEntireSemester() {
      const sem = document.getElementById("historySemFilter").value;
      const check = prompt(`Type "DELETE" to permanently wipe all attendance for ${sem}:`);
      if (check === "DELETE") {
        try {
          const snap = await db.collection("attendance_history").where("semester", "==", sem).get();
          const batch = db.batch();
          snap.forEach(doc => batch.delete(doc.ref));
          await batch.commit();
          alert(`✅ All records for ${sem} have been deleted!`);
          loadSavedSessions();
        } catch (e) {
          alert("Wipe error: " + e.message);
        }
      }
    }

    // CUMULATIVE REPORT
    async function loadCumulativeReport() {
      const sub = document.getElementById("reportSub").value.trim().toLowerCase();
      const sem = document.getElementById("reportSem").value;
      const cont = document.getElementById("reportTableArea");

      document.getElementById("reportCard").style.display = "block";
      cont.innerHTML = `<div style="text-align:center; padding:15px;">Calculating...</div>`;

      try {
        const snap = await db.collection("attendance_history").where("semester", "==", sem).get();
        const docs = [];
        snap.forEach(d => {
          const val = d.data();
          if (val.subject && val.subject.toLowerCase() === sub) docs.push(val);
        });

        const totalClasses = docs.length;
        document.getElementById("reportClassesHeld").innerText = totalClasses;
        document.getElementById("reportMeta").innerText = `${sem} - ${document.getElementById("reportSub").value}`;

        if (totalClasses === 0) {
          cont.innerHTML = `<div style="color:red; text-align:center; padding:10px;">No saved classes found for this subject and semester.</div>`;
          return;
        }

        const map = {};
        students.forEach(s => map[s.roll] = { roll: s.roll, name: s.name, attended: 0 });

        docs.forEach(session => {
          session.records.forEach(r => {
            if (map[r.roll] && r.status === "PRESENT") map[r.roll].attended++;
          });
        });

        let html = `
          <table class="report-table">
            <thead>
              <tr>
                <th>Roll</th>
                <th>Student Name</th>
                <th>Attended</th>
                <th>Presence %</th>
              </tr>
            </thead>
            <tbody>
        `;

        Object.values(map).forEach(row => {
          const pct = ((row.attended / totalClasses) * 100).toFixed(1);
          const isLow = pct < 75;
          html += `
            <tr>
              <td><strong>#${row.roll}</strong></td>
              <td>${row.name}</td>
              <td><strong>${row.attended}</strong> / ${totalClasses}</td>
              <td style="font-weight:bold; color:${isLow ? '#dc2626' : '#16a34a'}">
                ${pct}%
              </td>
            </tr>
          `;
        });

        html += `</tbody></table>`;
        cont.innerHTML = html;
      } catch (e) {
        cont.innerHTML = `<div style="color:red;">Error: ${e.message}</div>`;
      }
    }

    // 1-PAGE PDF
    function generateDailyPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      const sub = document.getElementById("subject").value || "Physics";
      const sem = document.getElementById("semester").value;
      const dt = document.getElementById("date").value || new Date().toISOString().slice(0, 10);

      doc.setFontSize(14);
      doc.setTextColor(37, 99, 235);
      doc.text("Daily Attendance Register", 14, 15);

      doc.setFontSize(9);
      doc.setTextColor(50, 50, 50);
      doc.text(`Subject: ${sub}  |  ${sem}  |  Date: ${dt}`, 14, 22);

      const tableData = students.map(s => [
        s.roll,
        s.name,
        dailyAttendance[s.roll] ? "PRESENT" : "ABSENT"
      ]);

      doc.autoTable({
        startY: 28,
        head: [['Roll No', 'Student Name', 'Status']],
        body: tableData,
        theme: 'striped',
        styles: { fontSize: 8.5, cellPadding: 2 },
        headStyles: { fillColor: [37, 99, 235] }
      });

      doc.save(`Attendance_${sem}_${dt}.pdf`);
    }
  </script>
</body>
